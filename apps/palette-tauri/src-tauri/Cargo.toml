[package]
name = "axon-palette-tauri"
version = "6.1.0"
description = "Tauri command palette for the Axon REST API"
edition = "2024"
rust-version = "1.97.1"
authors = ["dinglebear.ai <hello@dinglebear.ai>"]
license = "AGPL-3.0-only"
readme = "../README.md"
homepage = "https://axon.dinglebear.ai"
repository = "https://github.com/dinglebear-ai/axon"
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[workspace]

[workspace.lints.rust]
unsafe_code = "deny"
missing_crate_level_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_import_braces = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing_safety_doc = "deny"
mod_module_files = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
bare_urls = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"

[lints]
workspace = true

[lib]
name = "axon_palette_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "axon-palette-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
dirs = "6"
futures = "0.3.32"
futures-util = "0.3"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
russh = "0.62.5"
russh-sftp = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["image-png", "tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3.2"
tokio = { version = "1", features = ["sync", "net", "io-util", "time", "macros", "rt", "process"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
