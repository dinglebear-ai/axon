name: release

# Run by release-please after it creates an axon version tag.
# Builds the axon CLI for Linux + Windows, packages each with a SHA256 checksum,
# and publishes a GitHub Release with both artifacts attached.
#
# The Tauri axon-palette is released independently — see palette-release.yml
# (fired by `palette-v*` tags). It is no longer bundled into the axon `v*`
# release so that a palette-only change does not require a CLI version bump and
# vice-versa.
#
# Manual workflow_dispatch builds everything but skips attaching artifacts by
# default. release-please.yml dispatches this workflow with publish=true on the
# newly created v* tag after release-please creates the GitHub Release.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach artifacts to an existing release-please v* release"
        type: boolean
        default: false
      release_tag:
        description: "Existing v* tag to rebuild and publish (manual backfill only)"
        type: string
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Self-hosted Rust jobs build through kache (setup-rust-kache).
  # Incremental must be off under a compile wrapper; the local kache store
  # persists per runner and shares content through the filesystem remote.
  CARGO_INCREMENTAL: "0"

jobs:
  resolve-release:
    name: resolve immutable release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      # The resolver always checks out protected main, never the caller-selected ref.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve and validate canonical release tag
        id: resolve
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.ref_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$EVENT_REF" == "refs/heads/main" ]] || { echo "manual releases must be dispatched from main" >&2; exit 1; }
            tag="$REQUESTED_TAG"
          else
            tag="$EVENT_TAG"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release tag must be canonical vMAJOR.MINOR.PATCH" >&2; exit 1; }
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag" main
          [[ "$(git cat-file -t "refs/tags/$tag")" == "tag" ]] || { echo "release tag must be annotated" >&2; exit 1; }
          commit="$(git rev-parse "refs/tags/$tag^{}")"
          git merge-base --is-ancestor "$commit" origin/main || { echo "release tag is not reachable from protected main" >&2; exit 1; }
          printf 'commit=%s\ntag=%s\n' "$commit" "$tag" >> "$GITHUB_OUTPUT"

  web-assets:
    name: build web assets
    needs: resolve-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
          sparse-checkout: |
            apps/web
            assets
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build web panel once
        working-directory: apps/web
        run: npm ci && npm run build
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: axon-release-web-assets
          path: apps/web/out
          if-no-files-found: error

  axon-linux:
    name: build axon (linux)
    needs: [resolve-release, web-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Full checkout: the non-cone sparse list previously omitted root
      # Cargo.toml/Cargo.lock, which broke every build. LFS blobs come down as
      # pointers (lfs: false default) and are not needed to build.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
      - uses: ./.github/actions/setup-rust-kache
        with:
          toolchain: 1.97.1
          s3-access-key: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-prefix: ${{ vars.KACHE_S3_PREFIX }}
      - name: Install TLS fingerprinting build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang perl golang-go
          cmake --version
          clang --version
          perl --version
          go version
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: axon-release-web-assets
          path: apps/web/out
      - name: cargo build --release --bin axon
        run: cargo build --release --locked --bin axon
      - name: Verify release acquisition capabilities
        env:
          # `capabilities` initializes Config before reporting compile-time
          # features. Live providers are not contacted by this command, but
          # both required endpoints must still be syntactically present.
          TEI_URL: http://127.0.0.1:1
          QDRANT_URL: http://127.0.0.1:1
        run: |
          set -euo pipefail
          target/release/axon capabilities > capabilities.json
          jq -e '
            .build.tlsFingerprinting == true and
            .build.tlsClientInitialization == "ready" and
            .build.chrome == true
          ' capabilities.json
      - name: Package
        run: |
          set -euo pipefail
          cd target/release
          tar -czf axon-linux-x86_64.tar.gz axon
          sha256sum axon-linux-x86_64.tar.gz > axon-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: axon-linux-x86_64
          path: |
            target/release/axon-linux-x86_64.tar.gz
            target/release/axon-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  sign-linux:
    name: sign immutable Linux artifact
    needs: [resolve-release, axon-linux]
    runs-on: ubuntu-24.04
    environment: release-signing
    timeout-minutes: 10
    steps:
      # This job deliberately has no checkout and executes no selected source.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: axon-linux-x86_64
          path: dist
      - name: Verify, sign, and re-verify Linux artifact
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          AXON_UPDATE_MINISIGN_PUBKEY: ${{ vars.AXON_UPDATE_MINISIGN_PUBKEY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" || { echo "SIGNING_KEY is required" >&2; exit 1; }
          test -n "$SIGNING_KEY_PASSWORD" || { echo "SIGNING_KEY_PASSWORD is required" >&2; exit 1; }
          test -n "$AXON_UPDATE_MINISIGN_PUBKEY" || { echo "AXON_UPDATE_MINISIGN_PUBKEY is required for release publication" >&2; exit 1; }
          cd dist
          sha256sum --check axon-linux-x86_64.tar.gz.sha256
          sudo apt-get update && sudo apt-get install -y minisign
          umask 077
          SIGNING_KEY_FILE=$(mktemp)
          trap 'shred -u "$SIGNING_KEY_FILE"' EXIT
          printf '%s' "$SIGNING_KEY" > "$SIGNING_KEY_FILE"
          echo "$SIGNING_KEY_PASSWORD" | minisign -S -s "$SIGNING_KEY_FILE" \
            -m axon-linux-x86_64.tar.gz -x axon-linux-x86_64.tar.gz.minisig
          minisign -V -P "$AXON_UPDATE_MINISIGN_PUBKEY" \
            -m axon-linux-x86_64.tar.gz -x axon-linux-x86_64.tar.gz.minisig
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: axon-linux-signature
          path: dist/axon-linux-x86_64.tar.gz.minisig
          if-no-files-found: error

  axon-windows:
    name: build axon (windows)
    needs: [resolve-release, web-assets]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Full checkout: the non-cone sparse list previously omitted root
      # Cargo.toml/Cargo.lock, which broke every build. LFS blobs come down as
      # pointers (lfs: false default) and are not needed to build.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-axon-windows
      - name: Verify TLS fingerprinting build prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tool in @('cmake', 'clang', 'perl', 'go')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "required TLS fingerprinting build prerequisite is missing: $tool"
            }
          }
          cmake --version
          clang --version
          perl --version
          go version
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: axon-release-web-assets
          path: apps/web/out
      - name: cargo build --release --bin axon
        run: cargo build --release --locked --bin axon
        env:
          # The repo's rustc-wrapper is a bash script and can't run as a Windows
          # rustc wrapper ("%1 is not a valid Win32 application", os error 193).
          # Disable it here, matching the palette-windows job.
          CARGO_BUILD_RUSTC_WRAPPER: ""
      - name: Verify release acquisition capabilities
        shell: pwsh
        env:
          # Keep this smoke self-contained; `capabilities` validates the
          # required endpoints but does not connect to either provider.
          TEI_URL: http://127.0.0.1:1
          QDRANT_URL: http://127.0.0.1:1
        run: |
          $ErrorActionPreference = 'Stop'
          $capabilities = (& target/release/axon.exe capabilities | ConvertFrom-Json)
          if (-not $capabilities.build.tlsFingerprinting) {
            throw 'release binary does not contain TLS fingerprinting'
          }
          if ($capabilities.build.tlsClientInitialization -ne 'ready') {
            throw "TLS client smoke failed: $($capabilities.build.tlsClientInitialization)"
          }
          if (-not $capabilities.build.chrome) {
            throw 'release binary does not contain Chrome support'
          }
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location target/release
          Compress-Archive -Path axon.exe -DestinationPath axon-windows-x86_64.zip -Force
          $hash = (Get-FileHash axon-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  axon-windows-x86_64.zip" | Out-File -Encoding ascii axon-windows-x86_64.zip.sha256
          Pop-Location
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: axon-windows-x86_64
          path: |
            target/release/axon-windows-x86_64.zip
            target/release/axon-windows-x86_64.zip.sha256
          if-no-files-found: error

  publish:
    name: publish github release
    needs: [resolve-release, axon-linux, sign-linux, axon-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Attach artifacts only when release-please dispatches this workflow on an
    # existing v* release tag.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-release.outputs.tag }}"
          gh release view "$tag" >/dev/null
          gh release upload "$tag" \
            dist/axon-linux-x86_64.tar.gz \
            dist/axon-linux-x86_64.tar.gz.sha256 \
            dist/axon-linux-x86_64.tar.gz.minisig \
            dist/axon-windows-x86_64.zip \
            dist/axon-windows-x86_64.zip.sha256 \
            --clobber
