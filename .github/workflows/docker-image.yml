name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - src/**
      - crates/**
      - apps/web/**
      - assets/**
      - vendor/**
      - .cargo/**
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - rust-toolchain.toml
      - config/Dockerfile*
      - .github/workflows/docker-image.yml
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: changes
    runs-on: ci-pool-ops
    timeout-minutes: 10
    outputs:
      docker: ${{ steps.classify.outputs.docker == 'true' || steps.classify.outputs.full_ci == 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepare trusted changed path classifier
        run: |
          set -euo pipefail
          classifier="scripts/ci/changed_paths.py"
          trusted="/tmp/axon-changed-paths.py"
          cp "$classifier" "$trusted"
          chmod +x "$trusted"
          echo "AXON_CHANGED_PATHS=$trusted" >> "$GITHUB_ENV"
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 "$AXON_CHANGED_PATHS" --event "$EVENT_NAME" --output "$GITHUB_OUTPUT" --write-changed-files changed-files.txt

  build:
    name: build-and-push
    # GitHub-hosted, not ci-pool-system: the self-hosted pools run with
    # DIND=false, and ci-runner-farm's fail-closed gate refuses to start
    # privileged (DinD) runners while org-scoped targeting covers public
    # repos -- so no self-hosted pool can offer a Docker daemon to this job.
    # Nothing here is host-local (buildx cache is type=gha, push uses
    # GITHUB_TOKEN), so a hosted runner is a drop-in. Timeout is raised
    # because a cold build has fewer cores than the old 8-core pool runner;
    # warm gha-cached builds stay fast.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [changes]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || needs.changes.outputs.docker == 'true' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/axon
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: config/Dockerfile
          # MUST stay pinned -- an untargeted build publishes a stage that
          # ships no binary. See the stage comment in config/Dockerfile, and
          # scripts/ci/check_dockerfile_build_targets.py, which enforces this.
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
