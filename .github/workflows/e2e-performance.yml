name: E2E performance report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 2"

permissions:
  contents: read

concurrency:
  group: axon-e2e-performance-exclusive
  cancel-in-progress: false

jobs:
  measure:
    name: Representative report-only baseline
    runs-on: [self-hosted, macOS, ARM64, axon-performance]
    timeout-minutes: 45
    env:
      AXON_E2E_RUNNER_CLASS: macbook-primary-performance
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Configure persistent cleanup registry
        run: echo "AXON_E2E_CLEANUP_REGISTRY=${RUNNER_TOOL_CACHE}/axon-e2e-cleanup/${GITHUB_REPOSITORY_ID}/registry.json" >> "$GITHUB_ENV"
      - name: Recover stale owned runs before mutation
        run: python3 scripts/e2e/cleanup-owned-runs.py --manifest-root target/e2e --registry "${{ env.AXON_E2E_CLEANUP_REGISTRY }}" --stale-seconds 21600 --report target/e2e/performance/stale-cleanup.json
      - name: Build measured binary
        run: cargo build --locked --bin axon
      - name: Measure representative source and retrieval
        run: just e2e-performance 5 target/e2e/performance/report.json
      - name: Validate bounded release projection
        run: python3 scripts/e2e/run-performance.py --input target/e2e/performance/report.json --out target/e2e/performance/validated-report.json > target/e2e/performance/release-projection.json
      - name: Outer ownership-checked teardown
        if: always()
        run: python3 scripts/e2e/cleanup-owned-runs.py --manifest-root target/e2e --registry "${{ env.AXON_E2E_CLEANUP_REGISTRY }}" --report target/e2e/performance/outer-cleanup.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: axon-e2e-performance-${{ github.sha }}
          path: |
            target/e2e/performance/validated-report.json
            target/e2e/performance/release-projection.json
            target/e2e/performance/*-cleanup.json
          retention-days: 90
          if-no-files-found: error
