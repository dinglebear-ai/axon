name: CI

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - "README.md"
      - "CHANGELOG.md"
      - "!docs/**"
      - "docs/reference/**"
      - "docs/**"
      - "!docs/sessions/**"
      - "!openwiki/**"
      - "!.agents/**"
      - "!plugins/**"
      - "plugins/**"
      - "!LICENSE*"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 3am UTC
  workflow_dispatch:
    inputs:
      run_live_qdrant_tests:
        description: "Run live Qdrant vector integration tests"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # On PRs, cancel superseded runs so the strict-up-to-date re-run treadmill
  # doesn't pile up 30-min runs. Never cancel on main/schedule.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Force plain (uncolored) CLI output so tests that assert on human-readable
  # symbols (e.g. "✗ docker") match: on the self-hosted runner the axon CLI's
  # color auto-detection enables ANSI codes, wrapping the symbol
  # ("\e[..m✗\e[0m docker") and breaking substring asserts. NO_COLOR wins the
  # CLI's color decision, so output is deterministic plain text in CI.
  NO_COLOR: "1"
  # Self-hosted Rust jobs use kache as RUSTC_WRAPPER. Incremental compilation
  # must be disabled under a compiler cache. Each runner keeps a persistent
  # local store and shares content through the filesystem remote, avoiding a
  # GitHub-cache round trip.
  CARGO_INCREMENTAL: "0"
  # Self-hosted runners persist $HOME/.axon between jobs. Isolate every job's
  # SQLite state so a different branch or migration epoch cannot poison startup.
  AXON_DATA_DIR: ${{ github.workspace }}/.ci-axon-data-${{ github.run_id }}-${{ github.job }}
  AURORA_REPO: ${{ vars.AURORA_REPO || 'dinglebear-ai/aurora' }}
  AURORA_REF: ${{ vars.AURORA_REF || '8748eb6434b3bbe4c75f25bfff71950b7efc051b' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      all: ${{ steps.classify.outputs.all }}
      routing_fallback: ${{ steps.classify.outputs.routing_fallback }}
      full_ci: ${{ steps.classify.outputs.full_ci }}
      ci_all: ${{ steps.classify.outputs.ci_all }}
      docs: ${{ steps.classify.outputs.docs }}
      docs_contracts: ${{ steps.classify.outputs.docs_contracts }}
      ci_contracts: ${{ steps.classify.outputs.ci_contracts == 'true' || steps.classify.outputs.full_ci == 'true' }}
      hooks: ${{ steps.classify.outputs.hooks == 'true' || steps.classify.outputs.full_ci == 'true' }}
      toml: ${{ steps.classify.outputs.toml == 'true' || steps.classify.outputs.full_ci == 'true' }}
      aurora_inventory: ${{ steps.classify.outputs.aurora_inventory }}
      workflow: ${{ steps.classify.outputs.workflow }}
      rust: ${{ steps.classify.outputs.rust == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
      web: ${{ steps.classify.outputs.web == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
      android: ${{ steps.classify.outputs.android == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
      palette: ${{ steps.classify.outputs.palette == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
      chrome: ${{ steps.classify.outputs.chrome == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
      docker: ${{ steps.classify.outputs.docker == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
      compose: ${{ steps.classify.outputs.compose == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
      mcp: ${{ steps.classify.outputs.mcp == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
      rag: ${{ steps.classify.outputs.rag == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
      auto_tag: ${{ steps.classify.outputs.auto_tag == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
      security: ${{ steps.classify.outputs.security == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
      release: ${{ steps.classify.outputs.release == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
      version_files: ${{ steps.classify.outputs.version_files == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
      openapi: ${{ steps.classify.outputs.openapi == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
      run_rust_contracts: ${{ steps.routes.outputs.run_rust_contracts }}
      run_ci_contracts: ${{ steps.routes.outputs.run_ci_contracts }}
      run_aurora_inventory: ${{ steps.routes.outputs.run_aurora_inventory }}
      run_android: ${{ steps.routes.outputs.run_android }}
      run_toml_fmt: ${{ steps.routes.outputs.run_toml_fmt }}
      run_lefthook_speed: ${{ steps.routes.outputs.run_lefthook_speed }}
      run_palette: ${{ steps.routes.outputs.run_palette }}
      run_windows_check: ${{ steps.routes.outputs.run_windows_check }}
      run_windows_build: ${{ steps.routes.outputs.run_windows_build }}
      run_web: ${{ steps.routes.outputs.run_web }}
      run_chrome: ${{ steps.routes.outputs.run_chrome }}
      run_clippy: ${{ steps.routes.outputs.run_clippy }}
      run_test: ${{ steps.routes.outputs.run_test }}
      run_security: ${{ steps.routes.outputs.run_security }}
      run_mcp_smoke: ${{ steps.routes.outputs.run_mcp_smoke }}
      run_live_rag: ${{ steps.routes.outputs.run_live_rag }}
      run_binary_smoke_build: ${{ steps.routes.outputs.run_binary_smoke_build }}
      run_binary_smoke: ${{ steps.routes.outputs.run_binary_smoke }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Prepare trusted changed path classifier
        run: |
          set -euo pipefail
          classifier="scripts/ci/changed_paths.py"
          trusted="/tmp/axon-changed-paths.py"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if ! git show "${{ github.event.pull_request.base.sha }}:$classifier" > "$trusted" 2>/dev/null; then
              cat > "$trusted" <<'PY'
          #!/usr/bin/env python3
          import argparse
          from pathlib import Path
          keys = "all routing_fallback full_ci ci_all codeql_all docs docs_contracts ci_contracts hooks toml aurora_inventory workflow rust web android palette chrome docker docker_build compose mcp rag auto_tag security release release_please version_files openapi codeql_actions codeql_javascript_typescript codeql_python codeql_rust codeql_java_kotlin".split()
          parser = argparse.ArgumentParser()
          parser.add_argument("--event", required=True)
          parser.add_argument("--output", type=Path, required=True)
          parser.add_argument("--write-changed-files", type=Path)
          args, _ = parser.parse_known_args()
          if args.write_changed_files:
              args.write_changed_files.write_text("")
          args.output.write_text("".join(f"{key}=true\n" for key in keys))
          for key in keys:
              print(f"{key}=true")
          PY
            fi
          else
            cp "$classifier" "$trusted"
          fi
          chmod +x "$trusted"
          echo "AXON_CHANGED_PATHS=$trusted" >> "$GITHUB_ENV"
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 "$AXON_CHANGED_PATHS" --event "$EVENT_NAME" --output "$GITHUB_OUTPUT" --write-changed-files changed-files.txt
      - name: Compute shared job routes
        id: routes
        env:
          RUN_RUST_CONTRACTS: ${{ steps.classify.outputs.rust == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' || steps.classify.outputs.mcp == 'true' || steps.classify.outputs.openapi == 'true' || steps.classify.outputs.version_files == 'true' || steps.classify.outputs.release == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.classify.outputs.auto_tag == 'true') }}
          RUN_CI_CONTRACTS: ${{ steps.classify.outputs.ci_contracts == 'true' || steps.classify.outputs.full_ci == 'true' }}
          RUN_AURORA_INVENTORY: ${{ steps.classify.outputs.android == 'true' || steps.classify.outputs.palette == 'true' || steps.classify.outputs.aurora_inventory == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
          RUN_ANDROID: ${{ steps.classify.outputs.android == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
          RUN_TOML_FMT: ${{ steps.classify.outputs.toml == 'true' || steps.classify.outputs.full_ci == 'true' }}
          RUN_LEFTHOOK_SPEED: ${{ steps.classify.outputs.hooks == 'true' || steps.classify.outputs.full_ci == 'true' }}
          RUN_PALETTE: ${{ steps.classify.outputs.palette == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
          RUN_WINDOWS_CHECK: ${{ github.event_name == 'pull_request' && (steps.classify.outputs.rust == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true') && contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          RUN_WINDOWS_BUILD: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && (steps.classify.outputs.rust == 'true' || steps.classify.outputs.web == 'true' || steps.classify.outputs.release == 'true' || steps.classify.outputs.auto_tag == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true')) || (github.event_name == 'pull_request' && (steps.classify.outputs.rust == 'true' || steps.classify.outputs.web == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true') && contains(github.event.pull_request.labels.*.name, 'ci:full')) }}
          RUN_WEB: ${{ steps.classify.outputs.web == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          RUN_CHROME: ${{ steps.classify.outputs.chrome == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
          RUN_CLIPPY: ${{ steps.classify.outputs.rust == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
          RUN_TEST: ${{ steps.classify.outputs.rust == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
          RUN_SECURITY: ${{ steps.classify.outputs.security == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
          RUN_MCP_SMOKE: ${{ (steps.classify.outputs.mcp == 'true' || steps.classify.outputs.rust == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) }}
          RUN_LIVE_RAG: ${{ github.event_name == 'pull_request' && (steps.classify.outputs.rag == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true') }}
          RUN_BINARY_SMOKE_BUILD: ${{ steps.classify.outputs.rust == 'true' || steps.classify.outputs.mcp == 'true' || steps.classify.outputs.web == 'true' || steps.classify.outputs.release == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
          RUN_BINARY_SMOKE: ${{ steps.classify.outputs.rust == 'true' || steps.classify.outputs.mcp == 'true' || steps.classify.outputs.web == 'true' || steps.classify.outputs.release == 'true' || steps.classify.outputs.ci_all == 'true' || steps.classify.outputs.full_ci == 'true' }}
        run: |
          for route in \
            RUN_RUST_CONTRACTS RUN_CI_CONTRACTS RUN_AURORA_INVENTORY RUN_ANDROID \
            RUN_TOML_FMT RUN_LEFTHOOK_SPEED RUN_PALETTE RUN_WINDOWS_CHECK \
            RUN_WINDOWS_BUILD RUN_WEB RUN_CHROME RUN_CLIPPY RUN_TEST RUN_SECURITY \
            RUN_MCP_SMOKE RUN_LIVE_RAG RUN_BINARY_SMOKE_BUILD RUN_BINARY_SMOKE; do
            printf '%s=%s\n' "${route,,}" "${!route}" >> "$GITHUB_OUTPUT"
          done

  lightweight-contracts:
    name: lightweight plugin, docs, and secret contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: ${{ github.event_name == 'pull_request' || needs.changes.outputs.docs_contracts == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1
      - name: Validate plugin contract
        run: just validate-plugin
      - name: Run hermetic operational regression catalog
        run: just operational-test-contracts
      - name: Validate active documentation semantics
        run: cargo xtask check-doc-contracts
      - name: Scan immutable candidate tree for credentials
        run: cargo xtask check-secrets --tree

  # Compile xtask once and fail fast on repository, schema, version, formatting,
  # and transport contracts before starting the expensive clippy/test fanout.
  rust-contracts:
    name: rust-contracts
    # GitHub-hosted while the ci-runner-farm standalone migration is in
    # flight (see palette-tauri): the farm reaped this job's runner mid-build
    # on consecutive attempts, and it gates the entire clippy/test fanout.
    runs-on: ubuntu-latest
    # 240, not 60. Measured across the last 40 ci.yml runs, this job's SUCCESSFUL
    # durations are: 14 15 16 16 22 29 32 34 36 40 42 43 58 59 62 70 75 88 93 96
    # 109 114 186 (minutes). 9 of 23 green runs (39%) exceed 60 minutes, and the
    # 60-minute cap already killed a passing run on this branch — job 92500921363
    # concluded `cancelled` at exactly 60m19s with steps 1-13 green and step 14
    # ("REST and workflow contracts") cut off mid-flight.
    #
    # The 34-minute figure this comment used to cite was one sample, not the
    # distribution. The real problem is the 14->186 min spread (kache cache hit
    # rate); until that is narrowed, the bound has to clear the observed worst
    # case rather than the typical one.
    timeout-minutes: 240
    needs: [changes]
    if: ${{ needs.changes.outputs.run_rust_contracts == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust-kache
        with:
          components: rustfmt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      # NOT dead: the "Palette OpenAPI type drift" contract step below shells
      # out to pnpm and hard-fails without it. It was removed earlier in this
      # branch as unused because the job's visible install command is `npm ci`.
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.3.0
      - name: create web assets placeholder
        run: |
          mkdir -p apps/web/out
          echo "AXON_ALLOW_FALLBACK_WEB_ASSETS=1" >> "$GITHUB_ENV"
      - name: Rust formatting
        run: cargo fmt --all -- --check
      # Build xtask ONCE, then invoke ./target/debug/xtask directly for every
      # check below.
      #
      # Measured on job 92475858863 (a 186-minute green run): this job produced
      # THIRTEEN cargo builds, and builds 2-13 each recompiled exactly 470
      # crates starting from proc-macro2 — a leaf build-dependency nothing in
      # this repo can invalidate. Every `cargo xtask ...` invocation rebuilt the
      # world instead of reusing the previous one. The fast (14-minute) runs have
      # the identical 13-build shape; kache just serves each rebuild in ~35s
      # instead of ~7min, which is why this stayed invisible.
      #
      # ROOT CAUSE (bisected locally, 2026-08-06): RUSTC_WRAPPER=kache. Under
      # kache, cargo never reaches a fresh state — it re-"compiles" the same
      # host/build-script crates on every invocation, forever. Two identical
      # back-to-back `cargo xtask check-no-mod-rs` runs, no source changes:
      #
      #   kache enabled   run 1: 179 crates   run 2: 179 crates  (40.6s)
      #   KACHE_DISABLED=1 run 1: 179 crates   run 2:   0 crates  ( 2.8s)
      #
      # The crates that churn are proc-macro and build-script deps (zerocopy,
      # cc, displaydoc, time-macros, rustix, clang-sys, ring, cmake) — host
      # artifacts — and everything downstream of a proc-macro follows them.
      #
      # Keep kache: it turns the ONE genuine cold build from ~45min into ~2min.
      # The bug only bites on repeated invocations, so the fix is to stop making
      # them. `cargo build -p xtask` once + direct binary invocation makes the
      # build count structural: one dev build, one test build, done. Same
      # pattern lefthook.yml already uses for the commit hooks.
      - name: Build xtask once
        run: cargo build --locked -p xtask
      - name: Repository and transport contracts
        run: |
          ./scripts/test-incus-bootstrap.sh
          retired='sol''dr|zc''cache|sc''cache'
          if rg -ni "$retired" \
            .github scripts/dev-setup.sh \
            docs/development docs/guides docs/operations docs/architecture/stack \
            deploy/incus/bootstrap.sh; then
            echo "Retired compiler cache reference found in an active surface."
            exit 1
          fi
          ./target/debug/xtask check-no-mod-rs
          ./target/debug/xtask check-mcp-http
          ./target/debug/xtask check-doc-links
          ./target/debug/xtask check-doc-contracts
          ./target/debug/xtask check-dep-graph
          ./target/debug/xtask check-redaction-logs
          ./target/debug/xtask check-sqlite-migrations
          python3 scripts/refresh_generated_contracts_staged.py --self-test
      - name: Kache degradation gate self-test
        if: ${{ needs.changes.outputs.workflow == 'true' }}
        run: ./scripts/kache-gate-selftest.sh
      - name: Use direct rustc for long contract compilation
        run: |
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      # Was `cargo run --manifest-path xtask/Cargo.toml --no-default-features`.
      # The `openapi-drift` feature only gates the openapi_drift module itself
      # (xtask/src/checks/openapi_drift.rs), which `generated-contracts` never
      # calls — so the flag changed no behaviour while forcing a whole extra
      # build configuration that cargo cannot share with the default-feature
      # build. That cost 8m30s on the slow run measured above.
      - name: Generated schema and documentation contracts
        run: ./target/debug/xtask generated-contracts check
      - name: Release version contracts
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.android == 'true' || needs.changes.outputs.palette == 'true' || needs.changes.outputs.version_files == 'true' }}
        run: ./target/debug/xtask check-release-versions --base origin/main --head HEAD --mode pr
      - name: Build auto-tag release plan from the existing xtask binary
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: ./target/debug/xtask check-release-versions --head HEAD --mode main --json > auto-tag-release-plan.json
      - name: Upload auto-tag release plan
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: axon-auto-tag-release-plan-${{ github.sha }}
          path: auto-tag-release-plan.json
          retention-days: 1
          if-no-files-found: error
      - name: MCP schema documentation
        if: ${{ needs.changes.outputs.mcp == 'true' }}
        run: python3 scripts/generate_mcp_schema_doc.py --check
      - name: Install web dependencies for API parity
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.android == 'true' || needs.changes.outputs.palette == 'true' }}
        run: npm ci --prefix apps/web
      # The workspace nextest job runs tests/http_api_parity_inventory.rs. Do
      # not compile that integration target a second time in this serial gate:
      # doing so delayed clippy/nextest fanout by 18-25 minutes on release CI.
      - name: OpenAPI drift contract
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.android == 'true' || needs.changes.outputs.palette == 'true' }}
        run: ./target/debug/xtask check-openapi-drift
      - name: Changed-file monolith policy
        if: ${{ needs.changes.outputs.rust == 'true' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$base" ]] || [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          python3 scripts/enforce_monoliths.py --base "$base" --head "$HEAD_SHA"
      - name: Static safety greps
        if: ${{ needs.changes.outputs.rust == 'true' }}
        run: |
          if rg -n "pg_advisory_lock\\s*\\(|pg_advisory_unlock\\s*\\(" src tests; then
            echo "Found banned session-scoped advisory lock usage."
            exit 1
          fi
          failures=()
          for file in $(rg -l 'ensure_schema' src/jobs/ 2>/dev/null || true); do
            if ! rg -q 'begin_schema_migration_tx|advisory' "$file"; then
              failures+=("$file")
            fi
          done
          if [ "${#failures[@]}" -gt 0 ]; then
            printf 'ensure_schema without advisory protection: %s\n' "${failures[@]}"
            exit 1
          fi
          if rg -n "spawn_adapter_skip_validation" src/ --glob '*.rs' --glob '!src/services/acp.rs'; then
            echo "spawn_adapter_skip_validation called from production code."
            exit 1
          fi
      - name: Kache health gate
        if: ${{ needs.changes.outputs.rust == 'true' }}
        env:
          KACHE_GATE_REQUIRE_DAEMON: "1"
        run: ./scripts/kache-gate.sh

  # These structural tests use only std and invoke the Python classifier as a
  # subprocess. Compiling them directly avoids building the application
  # workspace for a YAML-only change.
  ci-contracts:
    name: ci-contracts
    # GitHub-hosted while the ci-runner-farm standalone migration is in
    # flight (see palette-tauri): this job drew defective farm runners
    # (broken rustup dirs / no toolchain) on consecutive attempts.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: ${{ needs.changes.outputs.run_ci_contracts == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.97.1"
      - name: Lint GitHub Actions workflows
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSLo "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" \
            | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
      - name: Test changed-path routing
        run: |
          rustc --edition=2024 --test tests/ci_changed_paths.rs -o "$RUNNER_TEMP/ci_changed_paths"
          "$RUNNER_TEMP/ci_changed_paths"
      - name: Test workflow shapes
        run: |
          rustc --edition=2024 --test tests/workflow_shapes.rs -o "$RUNNER_TEMP/workflow_shapes"
          "$RUNNER_TEMP/workflow_shapes"

  aurora-primitive-inventory:
    name: aurora-primitive-inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes]
    if: ${{ needs.changes.outputs.run_aurora_inventory == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Check Aurora primitive inventory guard
        run: python3 scripts/check_aurora_primitive_inventory.py

  android:
    name: android
    # GitHub-hosted while the ci-runner-farm standalone migration is in
    # flight (see palette-tauri): long Gradle builds keep losing their farm
    # runner mid-step. Revert to ci-pool-system once the farm stabilizes.
    runs-on: ubuntu-latest
    # 60, not 30: measured 14-17m (android) / 5m (palette-tauri) on warm green
    # main runs, but both timed out at exactly 30m once the per-runner cargo
    # registries were isolated and had to repopulate from cold. GitHub reports a
    # timeout as `cancelled`, not `failed`, which makes it read like runner churn.
    timeout-minutes: 60
    needs: [changes]
    if: ${{ needs.changes.outputs.run_android == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Checkout Aurora design system
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          repository: ${{ env.AURORA_REPO }}
          ref: ${{ env.AURORA_REF }}
          path: .aurora-design-system
          token: ${{ secrets.AURORA_TOKEN || github.token }}

      - name: Export Aurora path
        run: echo "AXON_AURORA_ANDROID_PATH=$GITHUB_WORKSPACE/.aurora-design-system/android" >> "$GITHUB_ENV"

      - name: Set up pnpm for Aurora token generation
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.2

      - name: Set up Node for Aurora token generation
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "lts/*"

      - name: Install Aurora token dependencies
        working-directory: .aurora-design-system
        run: pnpm install --frozen-lockfile

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The Gradle build uses the hosted runner SDK; installing the legacy
          # `tools` package pulls the emulator and has failed on corrupt
          # downloads before tests even start.
          packages: ""

      - name: Run Android contracts, unit tests, lint, and debug APK build
        run: >
          apps/android/gradlew -p apps/android
          -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
          :app:verifyOpenApiGeneratedClient
          :app:testDebugUnitTest
          :app:lintDebug
          :app:copyDebugApkToRepoBin
          --no-daemon --stacktrace

      - name: Build Android release APK
        if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: >
          apps/android/gradlew -p apps/android
          -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
          :app:copyReleaseApkToRepoBin
          --no-daemon --stacktrace

      - name: Verify Android debug APK artifact
        run: test -s bin/axon-android-debug.apk

      - name: Verify Android release APK artifact
        if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: test -s bin/axon-android-release.apk

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: axon-android-apks
          path: |
            bin/axon-android-debug.apk
            bin/axon-android-release.apk
          if-no-files-found: error

  toml-fmt:
    name: toml-fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes]
    if: ${{ needs.changes.outputs.run_toml_fmt == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install taplo (pinned prebuilt binary)
        # Prebuilt static binary instead of `mise install cargo:taplo-cli`,
        # which compiled taplo from source on every run. Pinned by version and
        # sha256 so a moved release cannot silently change the tool.
        run: |
          set -euo pipefail
          version="0.10.0"
          sha256="8fe196b894ccf9072f98d4e1013a180306e17d244830b03986ee5e8eabeb6156"
          curl -fsSL -o /tmp/taplo.gz \
            "https://github.com/tamasfe/taplo/releases/download/${version}/taplo-linux-x86_64.gz"
          echo "${sha256}  /tmp/taplo.gz" | sha256sum -c -
          gunzip -f /tmp/taplo.gz
          chmod +x /tmp/taplo
          /tmp/taplo --version
      - name: taplo fmt --check
        run: |
          /tmp/taplo fmt --check \
            .cargo/config.toml \
            .config/nextest.toml \
            .taplo.toml \
            config.example.toml \
            deny.toml \
            release/components.toml \
            docs/reference/env-matrix.toml \
            rust-toolchain.toml

  lefthook-pre-commit-speed:
    name: lefthook pre-commit speed guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes]
    if: ${{ needs.changes.outputs.run_lefthook_speed == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: enforce pre-commit stays fast
        run: python3 scripts/check_lefthook_pre_commit_speed.py

  palette-tauri:
    name: palette-tauri
    # GitHub-hosted while the ci-runner-farm standalone migration is in
    # flight: the current farm runner image is hardened (no usable sudo) and
    # lacks the Tauri GTK/webkit dev stack, so this job cannot provision
    # itself there. Revert to ci-pool-rust once the farm image ships the
    # tauri prerequisites again.
    runs-on: ubuntu-latest
    # 60, not 30: measured 14-17m (android) / 5m (palette-tauri) on warm green
    # main runs, but both timed out at exactly 30m once the per-runner cargo
    # registries were isolated and had to repopulate from cold. GitHub reports a
    # timeout as `cancelled`, not `failed`, which makes it read like runner churn.
    timeout-minutes: 60
    needs: [changes]
    if: ${{ needs.changes.outputs.run_palette == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/palette-tauri/pnpm-lock.yaml
      - uses: ./.github/actions/setup-rust-kache
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
          install-tauri-deps: "true"
      - name: Use direct rustc for palette compilation
        run: |
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      - name: Install palette dependencies
        run: pnpm --dir apps/palette-tauri install --frozen-lockfile
      # CI-L1: these steps deliberately mirror `pnpm verify`
      # (lint → test → check:api → typecheck → vite:build) plus the cargo
      # gates below.
      # If you change the `verify` script in apps/palette-tauri/package.json,
      # update these steps to stay in sync (and vice versa).
      - name: Palette lint (Biome)
        run: pnpm --dir apps/palette-tauri lint
      - name: Palette TypeScript contract tests
        run: pnpm --dir apps/palette-tauri test
      - name: Palette typecheck
        run: pnpm --dir apps/palette-tauri typecheck
      # CI-M1: regenerate the OpenAPI-derived client types and fail on drift.
      # If the axon OpenAPI spec changed without regenerating axon-api.d.ts,
      # this diff is non-empty and the job fails before stale types can merge.
      - name: Palette OpenAPI type-drift check
        run: |
          pnpm --dir apps/palette-tauri generate:api
          git diff --exit-code apps/palette-tauri/src/lib/axon-api.d.ts
      - name: Palette Vite build
        run: pnpm --dir apps/palette-tauri vite:build
      # CI-H3: lint the security-relevant Tauri IPC/network bridge. src-tauri
      # declares its own [workspace], so the repo-root clippy/fmt jobs never
      # touch it — these scope explicitly via --manifest-path.
      - name: Tauri cargo fmt check
        run: cargo fmt --manifest-path apps/palette-tauri/src-tauri/Cargo.toml -- --check
      - name: Tauri cargo clippy
        run: cargo clippy --manifest-path apps/palette-tauri/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      # `Tauri cargo check` removed: the clippy step above runs --all-targets on
      # the same manifest, and clippy is a strict superset of check — it runs the
      # same type-check pass and then adds lints. The separate check step could
      # not fail unless clippy already had, while costing another build of the
      # palette crate graph.
      - name: Tauri cargo test
        # --test-threads=1: terminal_tests mutate the process-global SHELL env
        # (set_var("SHELL","/bin/zsh")); run in parallel that leaks into the
        # real-shell-spawn tests, which then try to spawn /bin/zsh. The
        # self-hosted runner image has no zsh (GitHub's ubuntu-latest does, which
        # masked this), so the spawn fails NotFound. Serialize to kill the race.
        run: cargo test --locked --manifest-path apps/palette-tauri/src-tauri/Cargo.toml -- --test-threads=1
      # CI-H1: build the actual desktop binary in CI (no installer bundle) so a
      # non-building Tauri app is caught here, before any release tag is cut.
      # Without this the first real desktop build happens only in
      # palette-release.yml *after* the palette-v* tag is published.
      - name: Tauri build (no bundle)
        run: pnpm --dir apps/palette-tauri exec tauri build --no-bundle --config src-tauri/tauri.ci.conf.json
      - name: Copy Tauri artifact to bin
        run: |
          node apps/palette-tauri/scripts/copy-artifacts.mjs
          test -s bin/axon-palette-release

  palette-tauri-android:
    name: palette-tauri-android
    # GitHub-hosted for the same farm-migration reason as palette-tauri
    # (runner reaped mid-build by the flapping farm controller).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [changes]
    if: ${{ needs.changes.outputs.run_palette == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/palette-tauri/pnpm-lock.yaml
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ""
      - uses: ./.github/actions/setup-rust-kache
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android
      - name: Install Palette Android SDK packages
        run: >-
          sdkmanager
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;28.2.13676358"
      - name: Install palette dependencies
        run: pnpm --dir apps/palette-tauri install --frozen-lockfile
      - name: Initialize Tauri Android project
        run: pnpm --dir apps/palette-tauri exec tauri android init --ci --skip-targets-install
      - name: Build Tauri Palette Android ARM64 debug APK
        run: pnpm --dir apps/palette-tauri exec tauri android build --debug --target aarch64 --apk --ci
      - name: Verify Palette Android debug APK
        run: test -s apps/palette-tauri/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: axon-palette-android-arm64-debug
          path: apps/palette-tauri/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error

  windows-check:
    name: windows-check (xtask only)
    runs-on: windows-latest
    # `cargo check -p xtask` transitively compiles axon (bench_embed dep); on a
    # cold Windows cache this lands right at the old 25-min cap (observed
    # 25m08s — a timeout despite all real steps passing). Give it headroom.
    timeout-minutes: 40
    needs: [changes]
    # A hosted windows-latest cargo check that transitively compiles axon is
    # too expensive for every Rust PR; opt in with the `ci:full` label.
    # Opt-in only: this compiles axon transitively on a windows-latest runner
    # and duplicates coverage from the mingw cross build, which already runs on
    # main and on ci:full PRs.
    if: ${{ needs.changes.outputs.run_windows_check == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: xtask-windows
      - name: create web assets placeholder
        shell: bash
        run: |
          mkdir -p apps/web/out
          echo "AXON_ALLOW_FALLBACK_WEB_ASSETS=1" >> "$GITHUB_ENV"
      # `cargo build` rather than `cargo check`: build is strictly stronger (it
      # type-checks and then produces the binary), and producing the binary lets
      # the two checks below run it directly instead of re-entering cargo twice.
      # Four cargo invocations become two.
      - name: cargo build -p xtask
        run: cargo build -p xtask --locked
      - name: cargo test -p xtask
        run: cargo test -p xtask --locked
      - name: xtask check-repo-structure
        shell: bash
        run: ./target/debug/xtask.exe check-repo-structure
      - name: xtask check-mcp-http
        shell: bash
        run: ./target/debug/xtask.exe check-mcp-http

  windows-build:
    name: windows-build (axon.exe)
    # Tags are created only after CI succeeds on main. Build the same release
    # binary on native Windows here so auto-tag cannot publish an immutable
    # release whose Windows artifact fails later in release.yml.
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [changes, rust-contracts, web-panel]
    if: ${{ always() && needs.changes.outputs.run_windows_build == 'true' && needs.rust-contracts.result == 'success' && (needs.web-panel.result == 'success' || needs.web-panel.result == 'skipped') }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: axon-windows-release
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: ${{ needs.web-panel.result == 'success' }}
        with:
          name: axon-web-assets
          path: apps/web/out
      - name: Use fallback web assets when the web app is unchanged
        if: ${{ needs.web-panel.result == 'skipped' }}
        shell: bash
        run: |
          mkdir -p apps/web/out
          echo "AXON_ALLOW_FALLBACK_WEB_ASSETS=1" >> "$GITHUB_ENV"
      - name: Test Windows secure artifact cleanup journal
        run: cargo test --release --locked -p axon-services artifact_cleanup_journal --no-fail-fast
      - name: Test Windows Qdrant bulk-load journal
        run: cargo test --release --locked -p axon-vectors qdrant::bulk_load::tests --no-fail-fast
      - name: cargo build axon release binary
        run: cargo build --release --locked --bin axon
      - name: Upload axon.exe artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: axon-windows-x86_64
          path: target/release/axon.exe
          if-no-files-found: error

  web-panel:
    name: web-panel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: ${{ needs.changes.outputs.run_web == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install web panel dependencies
        run: npm ci --prefix apps/web
      - name: Test web panel
        run: npm --prefix apps/web test
      - name: Typecheck web panel
        run: npm --prefix apps/web run lint
      - name: Build web panel assets once
        run: npm --prefix apps/web run build
      - name: Upload web panel assets
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: axon-web-assets
          path: apps/web/out
          if-no-files-found: error

  chrome-extension:
    name: chrome-extension
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes]
    if: ${{ needs.changes.outputs.run_chrome == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Test Chrome extension
        run: npm test --prefix apps/chrome-extension

  # `check` and `msrv` were removed because clippy is their strict superset.
  # The fast contract job must pass before either expensive Rust lane starts.
  clippy:
    name: clippy
    # GitHub-hosted while the ci-runner-farm standalone migration is in
    # flight (see palette-tauri): every current farm runner fails Rust
    # toolchain setup (missing rustup / unwritable toolchain dirs).
    runs-on: ubuntu-latest
    # 60, not 30: slowest green run measured at 34.9 min, so a 30-minute cap
    # would hard-fail a build that passes.
    timeout-minutes: 60
    needs: [changes]
    if: ${{ needs.changes.outputs.run_clippy == 'true' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-rust-kache
        with:
          components: clippy
      - name: create web assets placeholder
        run: |
          mkdir -p apps/web/out
          echo "AXON_ALLOW_FALLBACK_WEB_ASSETS=1" >> "$GITHUB_ENV"
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked --features test-helpers -- -D warnings

  test:
    name: test
    # GitHub-hosted while the ci-runner-farm standalone migration is in
    # flight (see palette-tauri): every current farm runner fails Rust
    # toolchain setup (missing rustup / unwritable toolchain dirs).
    runs-on: ubuntu-latest
    # 90, not 30: slowest green run measured at 53.3 min, and 4 of 15 green runs
    # exceed 30 min. A 30-minute cap would hard-fail builds that pass.
    timeout-minutes: 90
    needs: [changes]
    if: ${{ needs.changes.outputs.run_test == 'true' }}
    env:
      # Match the 8 MiB runtime thread stack from main.rs — deep scrape/extract
      # async chains overflow the 2 MiB rustc-test-harness default
      # (jobs::watch_lite::tests::lite_watch_run_now_records_completed_run).
      RUST_MIN_STACK: "8388608"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-rust-kache
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2
        with:
          tool: cargo-nextest@0.9.140
      - name: create web assets placeholder
        run: |
          mkdir -p apps/web/out
          echo "AXON_ALLOW_FALLBACK_WEB_ASSETS=1" >> "$GITHUB_ENV"
      - name: cargo nextest
        run: cargo nextest run --workspace --locked --features test-helpers

      - name: cargo test ignored cli infra tests
        run: cargo test --locked cli_ --features test-helpers -- --ignored --quiet

      - name: cargo test github integration (clone + cleanup regression)
        run: cargo test --locked --features test-helpers -- github_integration_ --ignored --quiet

      - name: ask quality regression fixtures
        run: ./scripts/test-ask-quality-regressions.sh --verify-only

  live-qdrant:
    name: live-qdrant
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_live_qdrant_tests) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      qdrant:
        image: qdrant/qdrant:v1.13.1
        ports:
          - 6333:6333
    env:
      AXON_TEST_QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: live Qdrant vector tests
        run: cargo test --locked --features live-qdrant qdrant -- --ignored

  # OPS-H1: stand up Qdrant + TEI (modeled on mcp-smoke) and run a real
  # embed→retrieve assertion on PRs that touch RAG code. Closes the gap where a
  # retrieval/RRF/rerank regression could merge and auto-release unverified.
  live-rag-pr:
    name: live-rag-pr
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.run_live_rag == 'true' }}
    timeout-minutes: 30
    services:
      qdrant:
        image: qdrant/qdrant:v1.13.1
        ports:
          - 6333:6333
    env:
      QDRANT_URL: http://127.0.0.1:6333
      TEI_URL: http://127.0.0.1:52000
      AXON_TEST_QDRANT_URL: http://127.0.0.1:6333
      AXON_TEST_TEI_URL: http://127.0.0.1:52000
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: live-rag-pr

      - name: Restore Hugging Face model cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/huggingface
          key: hf-tei-${{ runner.os }}-BAAI-bge-small-en-v1.5-v1

      - name: Start TEI (CPU)
        run: |
          mkdir -p .cache/huggingface
          docker run -d --name axon-tei -p 127.0.0.1::80 \
            -v "$PWD/.cache/huggingface:/hf-cache" \
            -e HF_HOME=/hf-cache \
            -e HF_HUB_CACHE=/hf-cache/hub \
            ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3 \
            --model-id BAAI/bge-small-en-v1.5
          tei_port="$(docker port axon-tei 80/tcp | awk -F: 'END { print $NF }')"
          case "$tei_port" in
            ''|*[!0-9]*)
              echo "Could not resolve dynamically published TEI port: $tei_port" >&2
              exit 1
              ;;
          esac
          echo "TEI_URL=http://127.0.0.1:$tei_port" >> "$GITHUB_ENV"
          echo "AXON_TEST_TEI_URL=http://127.0.0.1:$tei_port" >> "$GITHUB_ENV"

      - name: Wait for Qdrant and TEI
        run: |
          for _ in {1..90}; do
            if curl -fsS http://127.0.0.1:6333/healthz >/dev/null 2>&1 && \
               curl -fsS "$TEI_URL/health" >/dev/null 2>&1; then
              echo "Qdrant + TEI ready."
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for Qdrant/TEI readiness" >&2
          docker logs axon-tei || true
          exit 1

      # Match the web-asset fallback used by every other axon-building job so a
      # missing apps/web/out build doesn't fail the test binary compile/link.
      - name: create web assets placeholder
        run: |
          mkdir -p apps/web/out
          echo "AXON_ALLOW_FALLBACK_WEB_ASSETS=1" >> "$GITHUB_ENV"

      - name: live RAG embed→retrieve integration test
        env:
          # Deep async client/service futures can overflow the 2 MiB Rust test
          # harness stack before the live boundary is exercised.
          RUST_MIN_STACK: "16777216"
          AXON_DATA_DIR: .cache/axon-ci
          AXON_LOG_DIR: .cache/axon-ci/logs
          AXON_SQLITE_PATH: .cache/axon-ci/jobs.db
        run: |
          mkdir -p "$AXON_DATA_DIR" "$AXON_LOG_DIR"
          cargo test --locked --test rag_live_integration -- --ignored

      - name: Teardown TEI
        if: always()
        run: docker rm -f axon-tei || true

  security:
    name: security
    # GitHub-hosted while the ci-runner-farm standalone migration is in
    # flight (see palette-tauri): every current farm runner fails Rust
    # toolchain setup (missing rustup / unwritable toolchain dirs).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, rust-contracts]
    # The weekly cron routes the security audit while intentionally skipping
    # rust-contracts, so this job must evaluate its own route decision through
    # the skipped ancestor instead of inheriting the cascade (see mcp-smoke).
    if: ${{ always() && needs.changes.outputs.run_security == 'true' && (needs.rust-contracts.result == 'success' || needs.rust-contracts.result == 'skipped') }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-rust-kache

      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2
        with:
          tool: cargo-audit@0.22.1,cargo-deny@0.19.0

      - name: cargo audit
        run: |
          set -euo pipefail
          echo "Running cargo audit against Cargo.lock"
          cargo audit

      - name: cargo deny check
        run: |
          set -euo pipefail
          echo "Running cargo deny check (advisories, bans, licenses, sources)"
          cargo deny check

  mcp-smoke:
    name: mcp-smoke
    runs-on: ubuntu-24.04
    needs: [changes, binary-smoke-build]
    # A skipped web-panel ancestor propagates through binary-smoke-build unless
    # this downstream consumer explicitly evaluates its own result contract.
    if: ${{ always() && needs.binary-smoke-build.result == 'success' && needs.changes.outputs.run_mcp_smoke == 'true' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Fetch MCP doc fixture for smoke test
        run: mkdir -p docs && git show HEAD:docs/reference/mcp/overview.md > docs/reference/mcp/overview.md

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install mcporter
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        env:
          # mise's npm backend runs a supply-chain trust check that hard-fails
          # when a transitive dependency loses trusted-publisher evidence
          # between releases. On 2026-07-25 `@hono/node-server@1.19.15` (pulled
          # in by mcporter) published without trust evidence where 2.0.10 had
          # it, which broke this job on every PR including docs-only ones.
          # Shelling out to the npm CLI installs the same pinned mcporter
          # version without that check. This is a smoke-test tool, not a
          # shipped dependency.
          MISE_NPM_SHELL_OUT: "true"
        with:
          install_args: node npm:mcporter@0.7.3
      - name: Pin mcporter for mise shims
        # `mise install` fetches the tools but leaves no version pinned for
        # the shims, so every `mcporter` invocation dies with "No version is
        # set for shim: mcporter". Pin globally, exactly as that error asks.
        run: |
          mise use -g node npm:mcporter@0.7.3
          mcporter --version

      - name: Restore Hugging Face model cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/huggingface
          key: hf-tei-${{ runner.os }}-BAAI-bge-small-en-v1.5-v1

      # TEI is pinned to a release tag (not cpu-latest): the cache key is
      # immutable, so a floating tag would keep serving whatever image was
      # first cached — a permanently stale multi-GB cache entry. Bump the tag
      # here AND in the cache key (and in live-rag-pr) together.
      - name: Cache Docker images (TEI + Qdrant)
        id: docker-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/docker-images
          key: docker-${{ runner.os }}-tei-cpu-1.9.3-qdrant-1.13.1

      - name: Load Docker images from cache
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/docker-images/tei.tar
          docker load -i /tmp/docker-images/qdrant.tar

      - name: Pull and save Docker images
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          docker pull ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
          docker pull qdrant/qdrant:v1.13.1
          mkdir -p /tmp/docker-images
          docker save ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3 -o /tmp/docker-images/tei.tar
          docker save qdrant/qdrant:v1.13.1 -o /tmp/docker-images/qdrant.tar

      - name: create web assets placeholder
        run: |
          mkdir -p apps/web/out
          echo "AXON_ALLOW_FALLBACK_WEB_ASSETS=1" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: axon-linux-smoke
          path: target/debug
      - name: Prepare smoke binary
        run: chmod +x ./target/debug/axon

      - name: Write CI mcporter config
        run: |
          cat > config/mcporter.json <<EOF
          {
            "mcpServers": {
              "axon": {
                "url": "http://127.0.0.1:8001/mcp"
              }
            },
            "imports": []
          }
          EOF

      - name: Create CI env files for docker compose
        run: |
          # ~/.axon/.env — canonical compose interpolation/runtime env.
          mkdir -p "$HOME/.axon"
          {
            echo "AXON_HOME=$HOME/.axon"
            echo "AXON_DATA_DIR=$HOME/.axon"
            echo "QDRANT_URL=http://axon-qdrant:6333"
            echo "TEI_URL=http://localhost:52000"
            echo "AXON_GIT_SHA=$(git rev-parse HEAD)"
            echo "QDRANT_HTTP_PORT=55333"
            echo "QDRANT_GRPC_PORT=55334"
            echo "TEI_HTTP_PORT=52000"
            echo "TEI_EMBEDDING_MODEL=BAAI/bge-small-en-v1.5"
            echo "HF_TOKEN="
          } > "$HOME/.axon/.env"
          docker compose --env-file "$HOME/.axon/.env" -f docker-compose.prod.yaml config >/dev/null

      - name: Create Docker network for compose
        run: docker network create "${DOCKER_NETWORK:-axon}" || true

      - name: Start Axon infra
        run: docker compose --env-file "$HOME/.axon/.env" -f docker-compose.prod.yaml up -d axon-qdrant

      - name: Start TEI
        run: |
          mkdir -p .cache/huggingface
          docker run -d --name axon-tei -p 52000:80 \
            -v "$PWD/.cache/huggingface:/hf-cache" \
            -e HF_HOME=/hf-cache \
            -e HF_HUB_CACHE=/hf-cache/hub \
            ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3 \
            --model-id BAAI/bge-small-en-v1.5

      - name: Wait for Qdrant and TEI
        run: |
          for _ in {1..90}; do
            if curl -fsS http://127.0.0.1:55333/healthz >/dev/null 2>&1 && \
               curl -fsS http://127.0.0.1:52000/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for Qdrant/TEI readiness" >&2
          exit 1

      - name: Seed retrieve fixture
        env:
          AXON_DATA_DIR: .cache/axon-ci
          TEI_URL: http://127.0.0.1:52000
          QDRANT_URL: http://127.0.0.1:55333
          AXON_LOG_DIR: .cache/axon-ci/logs
          AXON_SQLITE_PATH: .cache/axon-ci/jobs.db
          AXON_EMBED_STRICT_PREDELETE: "false"
        run: ./target/debug/axon source "docs/reference/mcp/overview.md" --wait true --json

      - name: Start axon MCP HTTP server
        env:
          AXON_DATA_DIR: .cache/axon-ci
          TEI_URL: http://127.0.0.1:52000
          QDRANT_URL: http://127.0.0.1:55333
          AXON_LOG_DIR: .cache/axon-ci/logs
          AXON_SQLITE_PATH: .cache/axon-ci/jobs.db
        run: |
          ./target/debug/axon mcp --transport http &
          echo $! > /tmp/axon-mcp.pid
          for _ in {1..30}; do
            if nc -z 127.0.0.1 8001 2>/dev/null; then
              echo "axon MCP HTTP server ready on :8001"
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for axon MCP HTTP server" >&2
          exit 1

      - name: Run MCP mcporter smoke script
        env:
          AXON_DATA_DIR: .cache/axon-ci
          TEI_URL: http://127.0.0.1:52000
          QDRANT_URL: http://127.0.0.1:55333
        run: ./scripts/test-mcp-tools-mcporter.sh

      - name: Upload mcporter logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mcp-smoke-logs
          path: .cache/mcporter-test/

      - name: Teardown infra
        if: always()
        run: |
          kill "$(cat /tmp/axon-mcp.pid 2>/dev/null)" 2>/dev/null || true
          docker rm -f axon-tei || true
          docker compose --env-file "$HOME/.axon/.env" -f docker-compose.prod.yaml down || true

  binary-smoke-build:
    name: binary-smoke-build
    runs-on: ubuntu-24.04
    # Slowest observed green run: 9.6 min.
    timeout-minutes: 30
    needs: [changes, rust-contracts, web-panel]
    if: ${{ always() && needs.changes.outputs.run_binary_smoke_build == 'true' && needs.rust-contracts.result == 'success' && (needs.web-panel.result == 'success' || needs.web-panel.result == 'skipped') }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Rust with local-only Kache for pull requests
        if: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/setup-rust-kache
      - name: Set up Rust with shared Kache for trusted pushes
        if: ${{ github.event_name != 'pull_request' }}
        uses: ./.github/actions/setup-rust-kache
        with:
          s3-access-key: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-prefix: ${{ vars.KACHE_S3_PREFIX }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: ${{ needs.web-panel.result == 'success' }}
        with:
          name: axon-web-assets
          path: apps/web/out
      - name: Use fallback web assets when the web app is unchanged
        if: ${{ needs.web-panel.result == 'skipped' }}
        run: |
          mkdir -p apps/web/out
          echo "AXON_ALLOW_FALLBACK_WEB_ASSETS=1" >> "$GITHUB_ENV"
      - name: cargo build axon
        run: cargo build --locked --bin axon
      - name: Upload smoke binary
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: axon-linux-smoke
          path: target/debug/axon
          if-no-files-found: error

  binary-smoke:
    name: binary-smoke
    # This job executes a PR-built binary and PR-editable smoke scripts. Keep it
    # on GitHub-hosted ephemeral infrastructure, outside the ops trust domain.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes, binary-smoke-build]
    # always() is required, not decorative: a skipped ancestor (web-panel, on any
    # PR that touches no web files) propagates through the needs graph and skips
    # this job even though binary-smoke-build succeeded and the condition below
    # is true. ci-gate then correctly fails with "binary-smoke was skipped even
    # though its required condition is true". The explicit result check still
    # gates execution.
    if: ${{ always() && needs.changes.outputs.run_binary_smoke == 'true' && needs.binary-smoke-build.result == 'success' }}
    env:
      TEI_URL: http://127.0.0.1:52000
      QDRANT_URL: http://127.0.0.1:53333
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: axon-linux-smoke
          path: target/debug
      - name: smoke test binary help output
        run: |
          chmod +x ./target/debug/axon
          ./target/debug/axon --help
      - name: Smoke test generated shell completions
        run: ./scripts/check_shell_completions.sh ./target/debug/axon
      - name: Smoke test MCP OAuth protection
        env:
          USE_PREBUILT_AXON: "1"
          AXON_BIN: ${{ github.workspace }}/target/debug/axon
        run: ./scripts/test-mcp-oauth-protection.sh

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: always()
    needs:
      - changes
      - lightweight-contracts
      - rust-contracts
      - ci-contracts
      - aurora-primitive-inventory
      - android
      - toml-fmt
      - lefthook-pre-commit-speed
      - palette-tauri
      - palette-tauri-android
      - windows-check
      - windows-build
      - web-panel
      - chrome-extension
      - clippy
      - test
      - security
      - mcp-smoke
      - live-rag-pr
      - binary-smoke-build
      - binary-smoke
    steps:
      - name: verify required jobs passed or were intentionally skipped
        run: |
          set -euo pipefail
          require_success() {
            local name="$1"
            local result="$2"
            case "$result" in
              success) printf '%s=%s\n' "$name" "$result" ;;
              *) echo "::error::$name concluded $result" >&2; exit 1 ;;
            esac
          }
          require_success_or_intentional_skip() {
            local name="$1"
            local result="$2"
            local should_run="$3"
            case "$result:$should_run" in
              success:*) printf '%s=%s\n' "$name" "$result" ;;
              skipped:false) printf '%s=%s\n' "$name" "$result" ;;
              skipped:true) echo "::error::$name was skipped even though its required condition is true" >&2; exit 1 ;;
              *) echo "::error::$name concluded $result" >&2; exit 1 ;;
            esac
          }
          require_success changes "${{ needs.changes.result }}"
          require_success_or_intentional_skip lightweight-contracts "${{ needs.lightweight-contracts.result }}" "${{ github.event_name == 'pull_request' || needs.changes.outputs.docs_contracts == 'true' }}"
          require_success_or_intentional_skip rust-contracts "${{ needs.rust-contracts.result }}" "${{ needs.changes.outputs.run_rust_contracts }}"
          require_success_or_intentional_skip ci-contracts "${{ needs.ci-contracts.result }}" "${{ needs.changes.outputs.run_ci_contracts }}"
          require_success_or_intentional_skip aurora-primitive-inventory "${{ needs.aurora-primitive-inventory.result }}" "${{ needs.changes.outputs.run_aurora_inventory }}"
          require_success_or_intentional_skip android "${{ needs.android.result }}" "${{ needs.changes.outputs.run_android }}"
          require_success_or_intentional_skip toml-fmt "${{ needs.toml-fmt.result }}" "${{ needs.changes.outputs.run_toml_fmt }}"
          require_success_or_intentional_skip lefthook-pre-commit-speed "${{ needs.lefthook-pre-commit-speed.result }}" "${{ needs.changes.outputs.run_lefthook_speed }}"
          require_success_or_intentional_skip palette-tauri "${{ needs.palette-tauri.result }}" "${{ needs.changes.outputs.run_palette }}"
          require_success_or_intentional_skip palette-tauri-android "${{ needs.palette-tauri-android.result }}" "${{ needs.changes.outputs.run_palette }}"
          require_success_or_intentional_skip windows-check "${{ needs.windows-check.result }}" "${{ needs.changes.outputs.run_windows_check }}"
          require_success_or_intentional_skip windows-build "${{ needs.windows-build.result }}" "${{ needs.changes.outputs.run_windows_build }}"
          require_success_or_intentional_skip web-panel "${{ needs.web-panel.result }}" "${{ needs.changes.outputs.run_web }}"
          require_success_or_intentional_skip chrome-extension "${{ needs.chrome-extension.result }}" "${{ needs.changes.outputs.run_chrome }}"
          require_success_or_intentional_skip clippy "${{ needs.clippy.result }}" "${{ needs.changes.outputs.run_clippy }}"
          require_success_or_intentional_skip test "${{ needs.test.result }}" "${{ needs.changes.outputs.run_test }}"
          require_success_or_intentional_skip security "${{ needs.security.result }}" "${{ needs.changes.outputs.run_security }}"
          require_success_or_intentional_skip mcp-smoke "${{ needs.mcp-smoke.result }}" "${{ needs.changes.outputs.run_mcp_smoke }}"
          require_success_or_intentional_skip live-rag-pr "${{ needs.live-rag-pr.result }}" "${{ needs.changes.outputs.run_live_rag }}"
          require_success_or_intentional_skip binary-smoke-build "${{ needs.binary-smoke-build.result }}" "${{ needs.changes.outputs.run_binary_smoke_build }}"
          require_success_or_intentional_skip binary-smoke "${{ needs.binary-smoke.result }}" "${{ needs.changes.outputs.run_binary_smoke }}"
