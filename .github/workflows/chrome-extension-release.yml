name: chrome-extension-release

# Releases the Chrome extension independently of the main axon `v*` releases.
#
# Run by release-please after it creates a Chrome-extension tag whose version
# matches apps/chrome-extension/manifest.json.
# Builds the distributable zip (real files, no symlinks), checksums it, and
# publishes a GitHub Release with the zip + SHA256 attached.
#
# Packaging starts only from a published chrome-ext-v* GitHub Release and
# checks out that immutable tag on a hosted x86_64 runner.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: package chrome extension
    if: ${{ startsWith(github.event.release.tag_name, 'chrome-ext-v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write  # required to upload release artifacts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Build extension zip
        id: build
        run: |
          set -euo pipefail
          manifest="apps/chrome-extension/manifest.json"
          version="$(grep -m1 -E '^[[:space:]]*"version"[[:space:]]*:' "$manifest" \
            | sed -E 's/.*:[[:space:]]*"([^"]+)".*/\1/')"
          if [[ -z "$version" ]]; then
            echo "::error::could not read version from $manifest" >&2
            exit 1
          fi

          # On release-please dispatch, the tag version must match the manifest
          # version so a release can never ship a zip the tag disagrees with.
          tag="${{ github.event.release.tag_name }}"
          if [[ "$tag" == chrome-ext-v* ]]; then
            tag_version="${tag#chrome-ext-v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "::error::tag chrome-ext-v$tag_version does not match manifest version $version — bump $manifest before tagging" >&2
              exit 1
            fi
          fi

          ./apps/chrome-extension/package.sh
          dist="apps/chrome-extension/dist"
          name="axon-${version}.zip"
          # Checksum the bare filename (cd into dist first) so `sha256sum -c`
          # works wherever a downloader saves the zip + .sha256 side by side.
          ( cd "$dist" && sha256sum "$name" > "$name.sha256" )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=$dist/$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: axon
          path: |
            apps/chrome-extension/dist/*.zip
            apps/chrome-extension/dist/*.zip.sha256
          if-no-files-found: error

      - name: Attach artifacts to release
        # Attach artifacts only to the published release that triggered this
        # run.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ZIP_PATH: ${{ steps.build.outputs.zip }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          gh release view "$tag" >/dev/null
          gh release upload "$tag" \
            "$ZIP_PATH" \
            "$ZIP_PATH.sha256" \
            --clobber
