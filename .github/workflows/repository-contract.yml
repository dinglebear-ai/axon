name: Repository contract

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: repository-contract-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  contract:
    # The pinned reusable workflow hardcodes an unavailable ci-pool-ops runner.
    # Keep its immutable checks while adapting only the agent-file ownership
    # convention to this repository; all unrelated findings still fail.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out caller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: target
          persist-credentials: false
      - name: Check out immutable contract implementation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: dinglebear-ai/workflows
          ref: d1a41a7af9c41189e0f1062234364f5814bda99d # fleet-2026-07-31
          path: workflow-library
          persist-credentials: false
      - name: Test Axon agent policy adapter
        run: python3 -m unittest discover -s target/tests -p test_repository_contract.py
      - name: Validate repository contract
        run: >-
          python3 target/scripts/check_repository_contract.py
          --implementation workflow-library/scripts/fleet_contract.py
          --repo target
          --profile rust

  repository-contract:
    name: Repository Contract
    if: always()
    needs: [contract]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require repository contract
        env:
          RESULT: ${{ needs.contract.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "repository contract concluded $RESULT" >&2
            exit 1
          fi
