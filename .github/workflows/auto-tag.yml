name: auto-tag

# Selective, per-component auto-release detector.
#
# After a successful main CI run, this consumes the release plan generated by
# that exact run. Component metadata lives in `release/components.toml`.
#
# For each axon-native component, it diffs the component's shipping paths
# against that component's most recent tag. If the code changed AND the version
# was bumped (the computed tag does not exist), it creates the tag and GitHub
# Release, and dispatches the component's
# artifact workflow. release-please-driven components are excluded: their
# release PR, tag, GitHub Release, and artifact dispatch remain owned by
# release-please.yml.
#
# RELEASE GATES (OPS-M1): before a tag is created we (1) verify the new version
# is a strictly-monotonic bump over that component's highest existing tag, and
# (2) run only after the entire `CI` workflow succeeds for
# this exact commit. This prevents an accidental version edit or a red CI from
# auto-publishing a broken public release.
#
# BUMP ENFORCEMENT: if an axon-native component's code changed but its version
# was NOT bumped (the computed tag already exists), the plan fails before a tag
# is created. release-please-driven components defer their version edits and
# never enter this workflow's matrix.
#
# NOTE: tags pushed via GITHUB_TOKEN do NOT trigger other workflows (GitHub
# security model). We therefore dispatch each release workflow explicitly via
# the API after creating its tag — no PAT required.
#
# Version bumping rules (from CLAUDE.md): bump ONLY the component you changed.
#   feat!: / BREAKING CHANGE → major (X+1.0.0)
#   feat / feat(...)          → minor (X.Y+1.0)
#   everything else           → patch (X.Y.Z+1)

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: write   # required to create and push component release tags
  actions: write   # required to dispatch the release workflows

# Serialize runs for the same ref so two rapid merges to main cannot race on
# creating/pushing the same component tag (which would fail one run's `git
# push`). cancel-in-progress: false lets an in-flight release finish tagging
# rather than being cancelled by the next push.
concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix || '{"include":[]}' }}
    steps:
      - name: Check whether CI produced a release plan
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_NAME: axon-auto-tag-release-plan-${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          artifact_id=$(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == env.PLAN_NAME) | .id')
          if [ -n "$artifact_id" ]; then
            echo "has_plan=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_plan=false" >> "$GITHUB_OUTPUT"
            echo "CI produced no native release plan; release matrix is empty."
          fi
      - name: Download release plan produced by CI
        if: ${{ steps.probe.outputs.has_plan == 'true' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: axon-auto-tag-release-plan-${{ github.event.workflow_run.head_sha }}
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate release plan
        id: plan
        if: ${{ steps.probe.outputs.has_plan == 'true' }}
        run: |
          set -euo pipefail
          mv auto-tag-release-plan.json release-plan.json
          if ! jq -e 'type == "array" and all(.[]; ((.release_driver | type) == "string") and (.release_driver == "axon-native" or .release_driver == "release-please"))' release-plan.json >/dev/null; then
            echo "::error::release plan must declare release_driver as axon-native or release-please for every component" >&2
            cat release-plan.json >&2
            exit 1
          fi
          matrix=$(jq -c '{include: [.[] | select(.changed == true and .release_driver == "axon-native")]}' release-plan.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          cat release-plan.json

  release:
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '{"include":[]}' }}
    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    # Tag/release API work only. Green runs finish in seconds; the bound covers
    # slow tag pushes and workflow dispatch.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Create and push tag
        run: |
          set -euo pipefail
          tag="${{ matrix.candidate_tag }}"
          expected_sha="${{ github.event.workflow_run.head_sha }}"
          head_sha="$(git rev-parse --verify "HEAD^{commit}")"
          if [ "$head_sha" != "$expected_sha" ]; then
            echo "::error::checked-out HEAD $head_sha does not match workflow commit $expected_sha" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          local_target=""
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            local_target="$(git rev-parse --verify "$tag^{commit}")"
            if [ "$local_target" != "$expected_sha" ]; then
              echo "::error::local tag $tag resolves to $local_target, expected $expected_sha" >&2
              exit 1
            fi
          fi

          remote_refs="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          remote_target="$(awk '
            $2 ~ /\^\{\}$/ { peeled = $1 }
            $2 !~ /\^\{\}$/ { direct = $1 }
            END { if (peeled != "") print peeled; else if (direct != "") print direct }
          ' <<<"$remote_refs")"
          if [ -n "$remote_target" ] && [ "$remote_target" != "$expected_sha" ]; then
            echo "::error::remote tag $tag resolves to $remote_target, expected $expected_sha" >&2
            exit 1
          fi

          if [ -n "$remote_target" ]; then
            echo "Remote tag $tag already resolves to $expected_sha."
          else
            remote_main="$(git ls-remote --heads origin refs/heads/main | awk 'NR == 1 { print $1 }')"
            if [ -z "$remote_main" ]; then
              echo "::error::remote refs/heads/main is missing" >&2
              exit 1
            fi
            if [ "$remote_main" != "$expected_sha" ]; then
              echo "::error::remote main now resolves to $remote_main, not workflow commit $expected_sha" >&2
              exit 1
            fi

            if [ -n "$local_target" ]; then
              git push origin "refs/tags/$tag"
              echo "Pushed existing local tag $tag at $expected_sha."
            else
              git tag "$tag" "$expected_sha"
              git push origin "refs/tags/$tag"
              echo "Created and pushed tag $tag at $expected_sha."
            fi
          fi

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ matrix.candidate_tag }}"
          repo="${{ github.repository }}"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists."
          else
            gh release create "$tag" --verify-tag --generate-notes --repo "$repo"
            echo "Created GitHub Release $tag."
          fi

      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "${{ matrix.release_workflow }}" \
            --repo "${{ github.repository }}" \
            --ref "${{ matrix.candidate_tag }}" \
            -f publish=true
