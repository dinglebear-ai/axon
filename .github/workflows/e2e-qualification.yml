name: E2E release qualification

on:
  workflow_call:
    inputs:
      evidence_run_id:
        description: Successful workflow run containing e2e-qualification-input
        required: true
        type: string
      tested_sha:
        description: Full commit SHA shared by every evidence record
        required: true
        type: string
      profile:
        description: Qualification policy profile
        required: false
        default: release-candidate
        type: string
      assembled_in_current_run:
        description: Evidence was produced by a successful prerequisite job in this workflow run
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: Successful workflow run containing e2e-qualification-input
        required: true
        type: string
      tested_sha:
        description: Full commit SHA shared by every evidence record
        required: true
        type: string
      profile:
        description: Qualification policy profile
        required: true
        default: release-candidate
        type: choice
        options: [pr, main, release-candidate, deployed-compatibility]

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-qualification-${{ inputs.tested_sha }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  qualify-tested-commit:
    name: qualify-${{ inputs.profile }}-${{ inputs.tested_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Execute only the workflow revision selected by GitHub. The separately
          # attested tested SHA remains evidence data, never executable input.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Restore checksum-bound evidence bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.evidence_run_id }}
          name: e2e-qualification-input
          path: target/e2e/evidence
      - name: Verify producer run completed successfully for the exact tested SHA
        if: ${{ !inputs.assembled_in_current_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EXPECTED_SHA: ${{ inputs.tested_sha }}
        run: |
          actual_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}" --jq '.head_sha')"
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}" --jq '.conclusion')"
          workflow_path="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}" --jq '.path')"
          test "$actual_sha" = "$EXPECTED_SHA"
          test "$conclusion" = success
          test "$workflow_path" = '.github/workflows/e2e-qualification-assemble.yml'
      - name: Verify prerequisite-job evidence is bound to this exact run and SHA
        if: ${{ inputs.assembled_in_current_run }}
        env:
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EXPECTED_SHA: ${{ inputs.tested_sha }}
        run: |
          test "$EVIDENCE_RUN_ID" = "$GITHUB_RUN_ID"
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - name: Bind bundle to requested profile and tested commit
        env:
          EXPECTED_PROFILE: ${{ inputs.profile }}
          EXPECTED_SHA: ${{ inputs.tested_sha }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          index=json.loads(Path("target/e2e/evidence/qualification-index.json").read_text())
          expected_sha=os.environ["EXPECTED_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}",expected_sha) is None or index.get("tested_sha") != expected_sha:
              raise SystemExit("qualification evidence tested SHA mismatch")
          if index.get("profile") != os.environ["EXPECTED_PROFILE"]:
              raise SystemExit("qualification evidence profile mismatch")
          attestation=index.get("assembly_attestation",{})
          if attestation.get("workflow") != ".github/workflows/e2e-qualification-assemble.yml":
              raise SystemExit("qualification assembly workflow mismatch")
          if str(attestation.get("run_id")) != os.environ.get("EVIDENCE_RUN_ID", ""):
              raise SystemExit("qualification assembly run mismatch")
          path=Path("target/e2e/evidence")/attestation.get("path","")
          if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest()!=attestation.get("sha256"):
              raise SystemExit("qualification assembly attestation digest mismatch")
          assembled=json.loads(path.read_text())
          if assembled.get("tested_sha")!=expected_sha or assembled.get("assembly",{}).get("run_id")!=os.environ["EVIDENCE_RUN_ID"]:
              raise SystemExit("qualification assembly attestation metadata mismatch")
          indexed={(item.get("id"),item.get("family"),item.get("sha256"),str(item.get("producer",{}).get("run_id"))) for item in index.get("artifacts",[])}
          attested={(item.get("id"),item.get("family"),item.get("sha256"),str(item.get("producer",{}).get("run_id"))) for item in assembled.get("artifacts",[])}
          if indexed!=attested or len(indexed)!=len(index.get("artifacts",[])):
              raise SystemExit("indexed producer metadata disagrees with assembly attestation")
          PY
      - name: Build deterministic unsigned qualification
        run: |
          python3 scripts/e2e/build-qualification-manifest.py \
            --index target/e2e/evidence/qualification-index.json \
            --evidence-root target/e2e/evidence \
            --out target/e2e/qualification/qualification.json \
            --summary target/e2e/qualification/qualification.md \
            --checksums target/e2e/qualification/SHA256SUMS
      - name: Retain release-candidate qualification
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: e2e-qualification-${{ inputs.profile }}-${{ inputs.tested_sha }}
          path: |
            target/e2e/qualification/qualification.json
            target/e2e/qualification/qualification.md
            target/e2e/qualification/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
