name: release-please

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

env:
  # Self-hosted Rust jobs build through kache (setup-rust-kache);
  # incremental must be off under a compile wrapper.
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: release-please changes
    runs-on: ci-pool-ops
    timeout-minutes: 10
    outputs:
      release_please: ${{ steps.classify.outputs.release_please }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Classify release-please paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || 'push' }}
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: python3 scripts/ci/changed_paths.py --event "$EVENT_NAME" --output "$GITHUB_OUTPUT"

  release-please:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && needs.changes.outputs.release_please == 'true') }}
    runs-on: ci-pool-ops
    timeout-minutes: 15
    permissions:
      contents: write       # required to create release commits and tags
      issues: write         # required for release-please labels
      pull-requests: write  # required to create and update release PRs
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      prs: ${{ steps.release.outputs.prs }}
      palette_tag: ${{ steps.release.outputs['apps/palette-tauri--tag_name'] }}
      android_tag: ${{ steps.release.outputs['apps/android--tag_name'] }}
      chrome_tag: ${{ steps.release.outputs['apps/chrome-extension--tag_name'] }}
    steps:
      - name: Require release-please token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: test -n "$RELEASE_PLEASE_TOKEN"
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-pr-fixups:
    needs: release-please
    # release-please may update already-open release PRs without setting
    # prs_created=true. Run fixups for any PR payload it returns so component
    # source version files cannot drift behind the manifest/changelog bump.
    if: ${{ needs.release-please.outputs.prs != '' && needs.release-please.outputs.prs != '[]' && needs.release-please.outputs.prs != 'null' }}
    runs-on: ci-pool-rust
    timeout-minutes: 20
    permissions:
      contents: write  # required to push generated fixup commits to release PR branches
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: ./.github/actions/setup-rust-kache
      - name: Build xtask once
        run: cargo build --locked -p xtask
      - name: Apply release PR fixups
        env:
          PRS: ${{ needs.release-please.outputs.prs }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          base_ref="$(git rev-parse --abbrev-ref HEAD)"
          jq -c '.[]' <<<"$PRS" | while read -r pr; do
            branch="$(jq -er '.headBranchName | select(length > 0)' <<<"$pr")"
            base_branch="$(jq -er '.baseBranchName | select(length > 0)' <<<"$pr")"
            git fetch origin \
              "+refs/heads/$base_branch:refs/remotes/origin/$base_branch" \
              "+refs/heads/$branch:refs/remotes/origin/$branch"
            git checkout "$branch"
            ./target/debug/xtask release-please-fixup-plan \
              --base "origin/$base_branch" \
              --head HEAD \
              --json > fixup-plan.json
            while read -r fixup; do
              component="$(jq -r '.id' <<<"$fixup")"
              version="$(jq -r '.version' <<<"$fixup")"
              ./target/debug/xtask release-please-fixups --component "$component" --version "$version"
            done < <(jq -c '.[]' fixup-plan.json)
            fixup_commit_created=false
            if ! git diff --quiet; then
              git add --update
              git commit -m "chore: apply release-please fixups"
              fixup_commit_created=true
            fi
            ./target/debug/xtask check-release-versions \
              --base "origin/$base_branch" \
              --head HEAD \
              --mode pr
            if [[ "$fixup_commit_created" == true ]]; then
              git push origin HEAD:"$branch"
            fi
            git checkout "$base_ref"
          done

  dispatch-artifacts:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ci-pool-ops
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write  # required to dispatch artifact workflows
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-kache
      - name: Build dispatch plan
        env:
          RELEASE_OUTPUTS: ${{ toJson(needs.release-please.outputs) }}
        run: |
          cargo xtask release-please-dispatch-plan \
            --release-outputs "$RELEASE_OUTPUTS" \
            --json > dispatch-plan.json
          jq . dispatch-plan.json
      - name: Dispatch artifact workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          jq -c '.[]' dispatch-plan.json | while read -r item; do
            workflow="$(jq -r '.workflow' <<<"$item")"
            tag="$(jq -r '.tag' <<<"$item")"
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null
            gh workflow run "$workflow" --ref "$tag" -f publish=true
          done
