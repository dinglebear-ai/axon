name: palette-release

# Releases the Tauri axon-palette independently of the main axon `v*` releases.
#
# Run by release-please after it creates a palette-specific tag whose version
# matches the `version` in apps/palette-tauri/src-tauri/tauri.conf.json.
# Builds the portable palette binary for Linux + Windows plus Android APK/AAB
# packages, checksums each artifact, and publishes them on the palette release.
#
# Manual workflow_dispatch builds + packages the binaries and uploads them to
# the run as artifacts for inspection, but does NOT create a Release unless
# explicitly called with publish=true on a palette-v* tag. release-please.yml
# dispatches this workflow after release-please creates the GitHub Release.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach artifacts to an existing release-please palette-v* release"
        type: boolean
        default: false

concurrency:
  group: palette-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Self-hosted Rust jobs build through kache (setup-rust-kache).
  # Incremental must be off under a compile wrapper; the local kache store
  # persists per runner and shares content through the filesystem remote.
  CARGO_INCREMENTAL: "0"
  WINDOWS_PORTABLE_RUSTFLAGS: >-
    -C target-cpu=x86-64
    -C target-feature=-avx512f,-avx512vl,-avx512bw,-avx512dq,-avx512cd,-avx512ifma,-avx512vbmi,-avx512vbmi2,-avx512vnni,-avx512bitalg,-avx512vpopcntdq

jobs:
  version:
    name: resolve and validate version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Resolve and validate version
        id: version
        run: |
          set -euo pipefail
          conf="apps/palette-tauri/src-tauri/tauri.conf.json"
          version="$(grep -m1 -E '"version"[[:space:]]*:' "$conf" \
            | sed -E 's/.*:[[:space:]]*"([^"]+)".*/\1/')"
          if [[ -z "$version" ]]; then
            echo "::error::could not read version from $conf" >&2
            exit 1
          fi

          # The three palette version-bearing files must agree so the artifact,
          # the cargo package, and the npm package never disagree on a version.
          pkg="$(grep -m1 -E '"version"[[:space:]]*:' apps/palette-tauri/package.json \
            | sed -E 's/.*:[[:space:]]*"([^"]+)".*/\1/')"
          crate="$(grep -m1 -E '^version[[:space:]]*=' apps/palette-tauri/src-tauri/Cargo.toml \
            | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ "$pkg" != "$version" || "$crate" != "$version" ]]; then
            echo "::error::palette version mismatch — tauri.conf.json=$version package.json=$pkg src-tauri/Cargo.toml=$crate (all three must match)" >&2
            exit 1
          fi

          # On release-please dispatch, the tag version must match
          # tauri.conf.json so a release can never ship a binary the tag
          # disagrees with.
          if [[ "${GITHUB_REF}" == refs/tags/palette-v* ]]; then
            tag_version="${GITHUB_REF#refs/tags/palette-v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "::error::tag palette-v$tag_version does not match version $version — bump $conf before tagging" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  frontend:
    name: build palette frontend
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          sparse-checkout: apps/palette-tauri
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/palette-tauri/pnpm-lock.yaml
      - name: Install palette dependencies
        run: pnpm --dir apps/palette-tauri install --frozen-lockfile
      - name: Build palette frontend once
        run: pnpm --dir apps/palette-tauri vite:build
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: axon-palette-frontend
          path: apps/palette-tauri/dist
          if-no-files-found: error

  palette-linux:
    name: build axon-palette (linux)
    needs: [version, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Full checkout: LFS blobs come down as pointers (lfs: false default) and
      # are not needed to build.
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/palette-tauri/pnpm-lock.yaml
      - uses: ./.github/actions/setup-rust-kache
        with:
          toolchain: 1.97.1
          install-tauri-deps: "true"
          s3-access-key: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-prefix: ${{ vars.KACHE_S3_PREFIX }}
      - name: Install palette dependencies
        run: pnpm --dir apps/palette-tauri install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: axon-palette-frontend
          path: apps/palette-tauri/dist
      - name: Build Tauri palette (portable binary)
        run: pnpm --dir apps/palette-tauri exec tauri build --no-bundle --ci --config src-tauri/tauri.ci.conf.json
      - name: Package
        run: |
          set -euo pipefail
          cd apps/palette-tauri/src-tauri/target/release
          tar -czf axon-palette-linux-x86_64.tar.gz axon-palette-tauri
          sha256sum axon-palette-linux-x86_64.tar.gz > axon-palette-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: axon-palette-linux-x86_64
          path: |
            apps/palette-tauri/src-tauri/target/release/axon-palette-linux-x86_64.tar.gz
            apps/palette-tauri/src-tauri/target/release/axon-palette-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  palette-windows:
    name: build axon-palette (windows)
    needs: [version, frontend]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Full checkout: LFS blobs come down as pointers (lfs: false default) and
      # are not needed to build.
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/palette-tauri/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/palette-tauri/src-tauri
          shared-key: release-palette-windows
      - name: Install palette dependencies
        run: pnpm --dir apps/palette-tauri install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: axon-palette-frontend
          path: apps/palette-tauri/dist
      # The avx512-disabling RUSTFLAGS keep the binary portable across CPUs;
      # the rustc-wrapper is a bash script that cannot run as a Windows rustc
      # wrapper, so it is disabled here.
      - name: Build Tauri palette (portable binary)
        run: pnpm --dir apps/palette-tauri exec tauri build --no-bundle --ci --config src-tauri/tauri.ci.conf.json
        env:
          RUSTFLAGS: ${{ env.WINDOWS_PORTABLE_RUSTFLAGS }}
          CARGO_BUILD_RUSTC_WRAPPER: ""
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location apps/palette-tauri/src-tauri/target/release
          Compress-Archive -Path axon-palette-tauri.exe -DestinationPath axon-palette-windows-x86_64.zip -Force
          $hash = (Get-FileHash axon-palette-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  axon-palette-windows-x86_64.zip" | Out-File -Encoding ascii axon-palette-windows-x86_64.zip.sha256
          Pop-Location
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: axon-palette-windows-x86_64
          path: |
            apps/palette-tauri/src-tauri/target/release/axon-palette-windows-x86_64.zip
            apps/palette-tauri/src-tauri/target/release/axon-palette-windows-x86_64.zip.sha256
          if-no-files-found: error

  palette-android:
    name: build axon-palette (android)
    needs: [version, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/palette-tauri/pnpm-lock.yaml
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
      - uses: ./.github/actions/setup-rust-kache
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          s3-access-key: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-prefix: ${{ vars.KACHE_S3_PREFIX }}
      - name: Install Palette Android SDK packages
        run: >-
          sdkmanager
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;28.2.13676358"
      - name: Install palette dependencies
        run: pnpm --dir apps/palette-tauri install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: axon-palette-frontend
          path: apps/palette-tauri/dist
      - name: Initialize Tauri Android project
        run: >-
          env NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          pnpm --dir apps/palette-tauri exec tauri android init
          --ci --skip-targets-install
      - name: Build Tauri Palette Android release packages
        run: >-
          env NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          pnpm --dir apps/palette-tauri exec tauri android build
          --apk --aab --ci --config src-tauri/tauri.ci.conf.json
      - name: Sign and package Android APK/AAB
        id: package
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUBLISH_REQUESTED: >-
            ${{
              startsWith(github.ref, 'refs/tags/palette-v') &&
              github.event_name == 'workflow_dispatch' &&
              inputs.publish
            }}
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          outputs="apps/palette-tauri/src-tauri/gen/android/app/build/outputs"
          mapfile -t apk_candidates < <(find "$outputs/apk" -type f -name '*.apk' | sort)
          mapfile -t aab_candidates < <(find "$outputs/bundle" -type f -name '*.aab' | sort)
          if [[ "${#apk_candidates[@]}" -ne 1 ]]; then
            echo "::error::expected exactly one Tauri release APK, found ${#apk_candidates[@]}" >&2
            find "$outputs/apk" -type f -print || true
            exit 1
          fi
          if [[ "${#aab_candidates[@]}" -ne 1 ]]; then
            echo "::error::expected exactly one Tauri release AAB, found ${#aab_candidates[@]}" >&2
            find "$outputs/bundle" -type f -print || true
            exit 1
          fi
          unsigned_apk="${apk_candidates[0]}"
          unsigned_aab="${aab_candidates[0]}"

          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bt="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          mkdir -p bin
          signing_ready=false
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" \
                && -n "${ANDROID_KEYSTORE_PASSWORD:-}" \
                && -n "${ANDROID_KEY_ALIAS:-}" \
                && -n "${ANDROID_KEY_PASSWORD:-}" ]]; then
            signing_ready=true
          fi
          if [[ "$PUBLISH_REQUESTED" == "true" && "$signing_ready" != "true" ]]; then
            echo "::error::Palette Android publishing requires Android keystore secrets" >&2
            exit 1
          fi

          if [[ "$signing_ready" == "true" ]]; then
            ks="$RUNNER_TEMP/palette-release-keystore.jks"
            aligned="$RUNNER_TEMP/palette-aligned.apk"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ks"
            apk="bin/axon-palette-android-${version}.apk"
            aab="bin/axon-palette-android-${version}.aab"
            "$bt/zipalign" -p -f 4 "$unsigned_apk" "$aligned"
            "$bt/apksigner" sign \
              --ks "$ks" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$apk" "$aligned"
            "$bt/apksigner" verify --verbose "$apk"
            cp "$unsigned_aab" "$aab"
            jarsigner \
              -keystore "$ks" \
              -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -keypass:env ANDROID_KEY_PASSWORD \
              "$aab" "$ANDROID_KEY_ALIAS"
            jarsigner -verify -verbose -certs "$aab"
            rm -f "$ks" "$aligned"
            signed=true
          else
            echo "::warning::no signing secrets configured — emitting explicitly unsigned Palette Android artifacts"
            apk="bin/axon-palette-android-${version}-unsigned.apk"
            aab="bin/axon-palette-android-${version}-unsigned.aab"
            "$bt/zipalign" -p -f 4 "$unsigned_apk" "$apk"
            cp "$unsigned_aab" "$aab"
            signed=false
          fi
          sha256sum "$apk" > "$apk.sha256"
          sha256sum "$aab" > "$aab.sha256"
          {
            echo "apk=$apk"
            echo "aab=$aab"
            echo "signed=$signed"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: axon-palette-android
          path: |
            ${{ steps.package.outputs.apk }}
            ${{ steps.package.outputs.apk }}.sha256
            ${{ steps.package.outputs.aab }}
            ${{ steps.package.outputs.aab }}.sha256
          if-no-files-found: error

  publish:
    name: publish github release
    needs: [version, palette-linux, palette-windows, palette-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Attach artifacts only when release-please dispatches this workflow on an
    # existing palette-v* release tag.
    if: >-
      startsWith(github.ref, 'refs/tags/palette-v') &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${{ needs.version.outputs.version }}"
          gh release view "$tag" >/dev/null
          gh release upload "$tag" \
            dist/axon-palette-linux-x86_64.tar.gz \
            dist/axon-palette-linux-x86_64.tar.gz.sha256 \
            dist/axon-palette-windows-x86_64.zip \
            dist/axon-palette-windows-x86_64.zip.sha256 \
            "dist/axon-palette-android-$version.apk" \
            "dist/axon-palette-android-$version.apk.sha256" \
            "dist/axon-palette-android-$version.aab" \
            "dist/axon-palette-android-$version.aab.sha256" \
            --clobber
