[package]
name = "axon-services"
build = "build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Typed Axon application services and cross-domain runtime composition shared by all transports."
authors.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
axon-core = { path = "../axon-core" }
axon-codex = { path = "../axon-codex" }
axon-error = { path = "../axon-error" }
axon-llm = { path = "../axon-llm" }
axon-api = { path = "../axon-api" }
axon-authz = { path = "../axon-authz" }
axon-memory = { path = "../axon-memory" }
axon-jobs = { path = "../axon-jobs" }
axon-observe = { path = "../axon-observe" }
axon-adapters = { path = "../axon-adapters" }
axon-route = { path = "../axon-route" }
axon-document = { path = "../axon-document" }
axon-embedding = { path = "../axon-embedding" }
axon-extract = { path = "../axon-extract" }
axon-ledger = { path = "../axon-ledger" }
axon-graph = { path = "../axon-graph" }
axon-vectors = { path = "../axon-vectors" }
axon-prune = { path = "../axon-prune" }
axon-retrieval = { path = "../axon-retrieval" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
psl = "2"
futures-util = "0.3"
fs2 = "0.4"
hex = "0.4"
reqwest = { version = "0.13", features = ["json", "rustls", "stream", "form"] }
rand_core = { version = "0.9", features = ["os_rng", "std"] }
sha2 = "0.10"
metrics = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
spider_agent = { version = "2.47.89", default-features = false, features = [
  "search_tavily",
  "openai",
] }
ssh2-config = "0.7.1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "fs",
  "io-util",
  "net",
  "process",
  "signal",
  "sync",
  "time",
] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
toml_edit = "0.25.11"
tracing = "0.1"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
regex = "1"
scraper = "0.22"
dotenvy = "0.15"
url = "2"
libc = "0.2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
[features]
test-util = []

[dev-dependencies]
axon-core = { path = "../axon-core", features = ["test-util"] }
httpmock = "0.8"
serial_test = "3"
proptest = "1"
tokio = { version = "1", features = ["test-util"] }
