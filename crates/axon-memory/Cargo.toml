[package]
name = "axon-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Persistent memory nodes, links, reinforcement, review, and retrieval for Axon."
authors.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
axon-api = { path = "../axon-api" }
chrono = { version = "0.4", features = ["serde"] }
axon-core = { path = "../axon-core" }
axon-embedding = { path = "../axon-embedding" }
axon-error = { path = "../axon-error" }
axon-graph = { path = "../axon-graph" }
axon-observe = { path = "../axon-observe" }
axon-vectors = { path = "../axon-vectors" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axon-adapters = { path = "../axon-adapters" }
axon-retrieval = { path = "../axon-retrieval" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
