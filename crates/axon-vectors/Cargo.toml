[package]
name = "axon-vectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Qdrant collection management, vector publication, and payload operations for Axon."
authors.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
axon-api = { path = "../axon-api" }
axon-core = { path = "../axon-core" }
axon-error = { path = "../axon-error" }
axon-observe = { path = "../axon-observe" }
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
prost-types = "0.13"
qdrant-client = { version = "1.18.0", default-features = false, features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[dev-dependencies]
httpmock = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
