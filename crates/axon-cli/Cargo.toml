[package]
name = "axon-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Command-line transport and command handlers for the Axon runtime."
authors.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
axon-api = { path = "../axon-api" }
axon-core = { path = "../axon-core" }
axon-jobs = { path = "../axon-jobs" }
axon-services = { path = "../axon-services" }
axon-mcp = { path = "../axon-mcp" }
axon-web = { path = "../axon-web" }
anyhow = "1"
flate2 = "1"
tar = "0.4"
zip = "3"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
indicatif = "0.18"
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json", "rustls", "stream", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "fs",
  "io-util",
  "net",
  "process",
  "signal",
  "sync",
  "time",
] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
sha2 = "0.11"
hex = "0.4"
url = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
[features]
test-util = []

[dev-dependencies]
axon-core = { path = "../axon-core", features = ["test-util"] }
spider = { version = "2", default-features = false, features = ["chrome", "chrome_screenshot"] }
httpmock = "0.8"
indicatif = { version = "0.18", features = ["in_memory"] }
serial_test = "3"
proptest = "1"
